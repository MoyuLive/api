# WARNING: Default values are for local development ONLY.
# Override in production via environment variables:
#   STREAM_API_DB__DSN, STREAM_API_USER__AUTH_SECRET,
#   STREAM_API_SRS__API_PASSWORD, STREAM_API_SRS__CALLBACK_SECRET,
#   STREAM_API_PUBLISH__PROTOCOLS
# Nested config keys use double underscores in environment variables.

http_port = 9081
cors_origins = [
    "http://localhost:5173",
    "http://127.0.0.1:5173",
    "http://localhost:5174",
    "http://127.0.0.1:5174",
]

[db]
dsn = "host=postgres user=yantube password=yantube_dev_password dbname=yantube port=5432 sslmode=disable"

[user]
allow_register = false
auth_realm = "stream api"
# Set via STREAM_API_USER__AUTH_SECRET env var in production
auth_secret = "change-me-in-production"

[srs]
api_url = "http://srs:1985"
api_user = "admin"
# WARNING: Change in production via STREAM_API_SRS__API_PASSWORD
api_password = "srs_admin_change_me"
# Set via STREAM_API_SRS__CALLBACK_SECRET env var in production
callback_secret = "srs-callback-secret-change-me"

[playback]
# Conservative default. Enable flv only on deployments with SRS http_remux.
protocols = "webrtc,hls"

[publish]
protocols = "rtmp,whip"

[storage]
upload_dir = "uploads"

[metrics]
enabled = true
